name: Synchro des calendriers

on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 min environ (GitHub peut décaler)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Synchroniser
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: node scripts/sync.mjs
      # GitHub suspend les tâches planifiées d'un dépôt public inactif depuis 60 jours :
      # un commit vide tous les ~45 jours garde la synchro en vie.
      - name: Garder la synchro active
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: maintien de la synchro planifiée"
            git push
          fi
